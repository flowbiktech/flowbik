services:
  - type: web
    name: flowbik-backend
    runtime: python
    region: singapore   # change to your nearest: oregon, ohio, virginia, frankfurt, singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false       # will prompt you to enter this in Render dashboard
      - key: RESEND_API_KEY
        sync: false       # will prompt you to enter this in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"
